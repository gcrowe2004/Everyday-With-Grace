<style>
:root{
  --bg:#FBF7F4; --surface:#FFFFFF; --tint:#F1E4DE; --line:#EADBD4;
  --text:#3D3533; --muted:#8A7F7C; --deep:#6E4B44; --main:#B98A7E;
  --m:#B98A7E; --mtint:#F1E4DE; --mdeep:#6E4B44;
  --ok:#6F9A7A; --shadow:0 1px 2px rgba(110,75,68,.06),0 6px 18px rgba(110,75,68,.06);
  --serif:'Lora',Georgia,'Times New Roman',serif; --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#1C1716; --surface:#262020; --tint:#342A28; --line:#3E3230;
  --text:#EFE6E2; --muted:#A9A09C; --deep:#F0D7CF; --main:#D6A89B; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#1C1716; --surface:#262020; --tint:#342A28; --line:#3E3230;
  --text:#EFE6E2; --muted:#A9A09C; --deep:#F0D7CF; --main:#D6A89B; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.5;
  text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--m);outline-offset:2px;border-radius:6px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--deep);margin:0;text-wrap:balance}
h1{font-size:30px;font-style:italic;line-height:1.15}
h2{font-size:22px;font-style:italic;line-height:1.2}
h3{font-size:17px;line-height:1.3}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--m);font-weight:500}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.soft{background:var(--mtint);border-radius:18px;padding:16px;border:0}
:root[data-theme="dark"] .soft{background:var(--tint)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .soft{background:var(--tint)}}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13px}
.pill[aria-pressed="true"]{background:var(--m);border-color:var(--m);color:#fff}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--m);color:#fff;font-weight:500;font-size:14px}
.btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
.link{color:var(--deep);text-decoration:none;border-bottom:1px solid var(--m)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.brand{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
/* checks */
.check{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--m);background:var(--surface);display:grid;place-items:center;padding:0}
.check svg{width:15px;height:15px;opacity:0;transition:opacity .15s}
.check[aria-checked="true"]{background:var(--m)}
.check[aria-checked="true"] svg{opacity:1}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .n{font-family:var(--serif);font-style:italic;color:var(--m);width:26px;flex:none;font-size:16px;line-height:1.4}
.task .t{flex:1}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--m)}
/* today hero */
.hero{border-radius:22px;padding:20px;background:var(--mtint);color:#3D3533;position:relative;overflow:hidden}
.hero h1,.hero h2,.hero h3{color:var(--mdeep)} .hero .eyebrow{color:var(--mdeep);opacity:.8}
.hero .blob{position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:var(--m);opacity:.18}
.hero .check{border-color:var(--mdeep);background:#fff} .hero .check[aria-checked="true"]{background:var(--mdeep)}
/* water */
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drop{width:34px;height:40px;border:0;background:none;padding:0}
.drop path{fill:var(--surface);stroke:var(--m);stroke-width:1.4}
.drop[aria-pressed="true"] path{fill:var(--m)}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 0;font-size:14px}
.scale button[aria-pressed="true"]{background:var(--m);color:#fff;border-color:var(--m)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
textarea{min-height:96px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);letter-spacing:.04em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--deep)}
.tab[aria-current="page"] svg{stroke:var(--m)}
/* chips scroller */
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .pill{flex:none}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--m);border-radius:6px}
/* calendar */
.cal{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px;font-size:10px}
.cal .h{text-align:center;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
.cal .wk{font-family:var(--serif);font-style:italic;color:var(--m);font-size:13px;display:flex;align-items:center}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:48px;padding:4px 1px;font-size:8.5px;overflow-wrap:anywhere;hyphens:auto;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center}
.cell.rest{background:var(--tint);color:var(--muted)}
.cell[aria-pressed="true"]{background:var(--m);color:#fff;border-color:var(--m)}
.cell.today{outline:2px solid var(--deep);outline-offset:1px}
/* challenge grid */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cbox{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;min-height:78px;text-align:left;font-size:10.5px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.cbox b{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--m);font-size:14px}
.cbox[aria-pressed="true"]{background:var(--m);color:#fff;border-color:var(--m)} .cbox[aria-pressed="true"] b{color:#fff}
details{border-bottom:1px solid var(--line)} details:last-child{border-bottom:0}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--m);font-size:20px;line-height:1}
details[open] summary::after{content:'–'}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--serif);font-size:34px;color:var(--deep);line-height:1}
.sheet{position:fixed;inset:0;background:rgba(40,28,26,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.gate{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding-inline:24px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--deep);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:25}
.note{font-size:12px;color:var(--muted);font-style:italic}
.bowlcol{display:flex;flex-direction:column;gap:6px}
#topbar{position:fixed;top:0;left:0;right:0;z-index:15;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#topbar .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:8px 16px}
.tbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:40px;display:grid;place-items:center;color:var(--deep);padding:0}
.tsearch{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;color:var(--muted);font-size:14px;text-align:left}
.tsearch svg{flex:none}.tsearch span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.navi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px;font-size:15px}
.navh{display:block;border:0;background:none;padding:14px 0 2px;font-family:var(--serif);font-style:italic;font-size:21px;color:var(--deep);text-align:left}
.app{padding-top:70px!important}.sheet.top{align-items:flex-start}.sheet.top .panel{border-radius:0 0 22px 22px;padding-top:calc(14px + env(safe-area-inset-top,0px));max-height:90%}
#app section,.task{scroll-margin-top:72px}
.flash{animation:flashy 1.6s ease}@keyframes flashy{0%,55%{box-shadow:0 0 0 3px var(--m)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.cbox{font-size:9.5px}.cgrid{gap:4px}}
</style>

<script>
const DATA = {"themes":{"jan":{"name":"Winter Linen","main":"#8497AB","bg":"#F5F7F9","deep":"#44566A","tint":"#E3E9EF"},"feb":{"name":"Rosé","main":"#BE8990","bg":"#FBF5F5","deep":"#7A4A52","tint":"#F3E2E3"},"mar":{"name":"Sage","main":"#93A88D","bg":"#F5F7F2","deep":"#4F6349","tint":"#E3EADF"},"apr":{"name":"Lilac","main":"#A597B8","bg":"#F7F5F9","deep":"#5D4F70","tint":"#E9E4EF"},"may":{"name":"Peony","main":"#D29D98","bg":"#FCF6F4","deep":"#8A5550","tint":"#F5E3E0"},"jun":{"name":"Honey","main":"#C9A35F","bg":"#FCF8F0","deep":"#7A5E2B","tint":"#F3E9D4"},"jul":{"name":"Coastal","main":"#72A6AB","bg":"#F2F8F8","deep":"#3B6468","tint":"#DDECEC"},"aug":{"name":"Terracotta","main":"#C4856A","bg":"#FBF4F0","deep":"#80503B","tint":"#F3E1D8"},"sep":{"name":"Olive","main":"#999663","bg":"#F8F7F1","deep":"#5C5A34","tint":"#EAE9DA"},"oct":{"name":"Merlot","main":"#96606A","bg":"#F9F3F3","deep":"#5E3139","tint":"#EEDDE0"},"nov":{"name":"Cinnamon","main":"#AD7A57","bg":"#FAF4EE","deep":"#6B4429","tint":"#F0E2D6"},"dec":{"name":"Evergreen","main":"#5F7D6F","bg":"#F4F6F4","deep":"#34493F","tint":"#DFE7E2"}},"months":[{"key":"jan","name":"January","theme":"New Year Reset","intro":"New year, fresh page. This month is about clearing the old, setting goals that actually excite you, and building a daily routine you can stick to.","weeks":[{"range":"Days 1–7","title":"Fresh start","tasks":[[1,"Write down 3 things you're leaving behind from last year and 3 things you want this year."],[2,"Take a \"before\" photo and write how you feel right now (body, mind, energy). You'll look back at this in December."],[3,"Change your sheets, open a window and clean your bedroom top to bottom."],[4,"Pick your \"word of the year\" (e.g. *calm, bold, healthy, free*). Make it your lock screen."],[5,"Write 3 goals for the year: one for your body, one for your mind, one for your life."],[6,"Break your first goal into 3 tiny steps you can start this month."],[7,"Plan your ideal morning routine on paper (keep it under 30 minutes)."]]},{"range":"Days 8–14","title":"Build the routine","tasks":[[8,"Try your new morning routine. Note what felt good and what didn't."],[9,"Drink a full glass of water before coffee or anything else."],[10,"Set a bedtime and an alarm 30 minutes before it to start winding down."],[11,"Make your bed the second you get up. Notice how it changes your mood."],[12,"Plan tomorrow tonight: write your top 3 priorities before bed."],[13,"Go for a 15-minute walk without your phone."],[14,"Eat one meal today with no screens. Just you and your food."]]},{"range":"Days 15–21","title":"Clear the clutter in your head","tasks":[[15,"Do a \"brain dump\": write every to-do and worry on one page."],[16,"Unfollow 10 accounts that make you feel bad about yourself."],[17,"Turn off non-essential notifications on your phone."],[18,"Write down one habit you want to quit and what you'll do instead."],[19,"Spend 10 minutes in silence: no music, no phone, just breathing."],[20,"Text someone you've been meaning to catch up with."],[21,"Say no to one thing you don't want to do."]]},{"range":"Days 22–31","title":"Lock it in","tasks":[[22,"Create a simple habit tracker (or use the one at the back of this planner)."],[23,"Prep a healthy breakfast or snack for the next 3 days."],[24,"Stretch for 10 minutes before bed."],[25,"Clean out your bag, wallet or backpack."],[26,"Write a list of 20 things that make you happy."],[27,"Do one thing from that list today."],[28,"Review your 3 goals. Still excited? Adjust anything that feels off."],[29,"Get outside in daylight for at least 20 minutes."],[30,"Go to bed on time, phone charging across the room."],[31,"Celebrate your first month: treat yourself to something small."]]}],"reflections":["What's one habit that already feels easier than it did on Day 1?","When did I feel most like myself this week?","What drained my energy, and how can I protect it?","What am I proud of this month?"],"affirm":"I am allowed to begin again, as many times as I need."},{"key":"feb","name":"February","theme":"Self-Love","intro":"The month of love starts with you. This month is about speaking kindly to yourself, setting boundaries, and treating yourself like someone you care about.","weeks":[{"range":"Days 1–7","title":"Kind words","tasks":[[1,"Write down 10 things you like about yourself (at least 3 that have nothing to do with looks)."],[2,"Every time you think something mean about yourself today, rephrase it like you'd say it to a friend."],[3,"Write 3 affirmations on sticky notes and put them on your mirror."],[4,"Look in the mirror and say one compliment out loud. Yes, it feels awkward. Do it anyway."],[5,"Write a letter to your younger self."],[6,"List 5 challenges you've already gotten through."],[7,"Take a photo of yourself you actually like and save it to a \"me\" album."]]},{"range":"Days 8–14","title":"Treat yourself","tasks":[[8,"Take yourself on a solo date: coffee, a walk, a bookstore."],[9,"Make your favorite meal from scratch."],[10,"Have a pamper night: face mask, long shower, comfy clothes."],[11,"Make a playlist of songs that make you feel unstoppable."],[12,"Buy or pick yourself flowers (wildflowers count)."],[13,"Write a love letter to your best friend (and consider sending it)."],[14,"Spend Valentine's Day doing only things that make *you* happy."]]},{"range":"Days 15–21","title":"Boundaries","tasks":[[15,"Write down 3 things people do that drain you."],[16,"Write one boundary for each of them (e.g. \"I don't answer texts after 10pm\")."],[17,"Practice saying \"no\" without explaining or apologizing."],[18,"Take an hour completely to yourself, guilt-free."],[19,"Mute or distance yourself from one person or group chat that makes you feel small."],[20,"Ask for help with something instead of doing it all alone."],[21,"Forgive yourself for one mistake you're still holding onto. Write it down, then tear it up."]]},{"range":"Days 22–28","title":"Body love","tasks":[[22,"Thank your body for 5 things it does for you every day."],[23,"Wear the outfit that makes you feel best, just because."],[24,"Move your body in a way that feels fun, not like punishment (dance in your room counts)."],[25,"Get rid of one piece of clothing that doesn't fit or makes you feel bad."],[26,"Eat something nourishing and something you love, no guilt."],[27,"Get 8 hours of sleep tonight."],[28,"Re-read your Day 1 list and add 5 more things you like about yourself."]]}],"reflections":["What's the kindest thing I said to myself this week?","What did I do this week just because it made me happy?","Which boundary was hardest to keep, and why?","How has the way I talk to myself changed this month?"],"affirm":"I speak to myself with the same love I give to others."},{"key":"mar","name":"March","theme":"Spring Clean","intro":"Out with the old. A clear space makes a clear mind. This month you'll declutter your room, your phone and your schedule, one small zone at a time.","weeks":[{"range":"Days 1–7","title":"Your room","tasks":[[1,"Clear off your nightstand. Keep only what you use every night."],[2,"Go through your makeup and skincare. Toss anything expired or unused."],[3,"Clean out one drawer."],[4,"Clean under your bed."],[5,"Declutter your desk or workspace."],[6,"Dust and wipe every surface in your room."],[7,"Add one thing that makes your room feel nicer: a plant, candle, photo or fairy lights."]]},{"range":"Days 8–14","title":"Your closet","tasks":[[8,"Pull out everything you haven't worn in a year."],[9,"Try each of those items on. Keep, donate or sell."],[10,"Sort your shoes and clean the ones you're keeping."],[11,"Go through your socks and underwear. Toss anything with holes."],[12,"Organize your closet by type or color."],[13,"Put together 5 outfits from what's left. Save photos of them."],[14,"Drop your donation bag off or list items to sell."]]},{"range":"Days 15–21","title":"Your digital life","tasks":[[15,"Delete apps you haven't opened in a month."],[16,"Organize your home screen into folders (or keep just one page)."],[17,"Delete 200 photos you don't need (blurry, duplicates, screenshots)."],[18,"Unsubscribe from 10 marketing emails."],[19,"Check your screen time. Set a daily limit on your most-used app."],[20,"Clean up your camera roll into albums."],[21,"Change your wallpaper to something that inspires you."]]},{"range":"Days 22–31","title":"The rest of your life","tasks":[[22,"Cancel one subscription you don't use."],[23,"Clean out your car, locker or bag."],[24,"Go through your fridge and pantry. Toss anything expired."],[25,"Clean your makeup brushes, hairbrush and phone case."],[26,"Clear your calendar of one commitment you've outgrown."],[27,"Wash your pillows or get new pillowcases."],[28,"Open all the windows and give your room a full refresh."],[29,"Organize your paperwork or school/work notes."],[30,"Walk around your space and notice how different it feels."],[31,"Make a \"one in, one out\" rule to keep the clutter from coming back."]]}],"reflections":["Which space feels the most different now?","What was hardest to let go of, and why?","How does my mood change in a clean room vs. a messy one?","What's one system I'll use to keep things tidy?"],"affirm":"I make room for what matters."},{"key":"apr","name":"April","theme":"Move Your Body","intro":"Movement isn't punishment, it's a celebration of what your body can do. This month is about finding exercise you actually enjoy and building energy from the inside out. Go at your own pace.","weeks":[{"range":"Days 1–7","title":"Just start","tasks":[[1,"Walk for 20 minutes. That's it."],[2,"Do a 10-minute beginner stretch video."],[3,"Put on 3 songs and dance like nobody's watching."],[4,"Take the stairs every chance you get today."],[5,"Try a 15-minute beginner yoga flow."],[6,"Hit 8,000 steps (or 2,000 more than your usual)."],[7,"Rest day. Write down which movement you liked most this week."]]},{"range":"Days 8–14","title":"Try new things","tasks":[[8,"Try a 20-minute at-home workout video."],[9,"Go on a hike or a walk somewhere new."],[10,"Try pilates or a mat workout."],[11,"Go for a bike ride, skate or swim."],[12,"Do a workout with a friend (in person or on FaceTime)."],[13,"Try a free class at a local gym or studio, or a new style of video at home."],[14,"Rest day. Take a long bath or foam roll."]]},{"range":"Days 15–21","title":"Fuel your body","tasks":[[15,"Drink 8 glasses of water today."],[16,"Add a fruit or vegetable to every meal."],[17,"Eat a protein-packed breakfast and notice your energy."],[18,"Swap one sugary drink for water or tea."],[19,"Pack a healthy snack so you're not stuck when hunger hits."],[20,"Cook a new healthy recipe."],[21,"Rest day. Get to bed early."]]},{"range":"Days 22–30","title":"Make it a habit","tasks":[[22,"Plan your workouts for the next week (3–4 days is plenty)."],[23,"Do a 5-minute core workout."],[24,"Take a \"walk and talk\" call instead of sitting."],[25,"Try a new workout playlist or podcast to move to."],[26,"Stretch for 10 minutes after waking up."],[27,"Repeat your favorite workout from this month."],[28,"Do something active outdoors for 30 minutes."],[29,"Try a workout you thought was \"too hard\" (modify it as needed)."],[30,"Write down how your energy, sleep and mood have changed since Day 1."]]}],"reflections":["What kind of movement made me feel the best?","What got in the way of moving, and how can I plan around it?","How did what I ate affect my energy?","What workout will I keep doing next month?"],"affirm":"My body is strong, capable and worth caring for."},{"key":"may","name":"May","theme":"Skin, Hair & Beauty","intro":"Feeling put-together is a form of self-respect. This month is about simple routines that make you look and feel your best, with no expensive products required.","weeks":[{"range":"Days 1–7","title":"Skin basics","tasks":[[1,"Take a makeup-free selfie in natural light. This is your skin \"before.\""],[2,"Build a simple routine: cleanser, moisturizer, sunscreen. Write it down."],[3,"Wash your face every night before bed, even when you're tired."],[4,"Wear sunscreen today (and every day from now on)."],[5,"Change your pillowcase. Plan to change it every week."],[6,"Drink 8 glasses of water and notice your skin tomorrow."],[7,"Do a face mask (a DIY honey mask works too)."]]},{"range":"Days 8–14","title":"Hair love","tasks":[[8,"Figure out your hair type and what it needs (moisture, volume, less heat)."],[9,"Do a hair mask or deep condition."],[10,"Give yourself a scalp massage for 5 minutes."],[11,"Go heat-free today. Try a new no-heat style."],[12,"Book a trim or trim your split ends."],[13,"Learn one new hairstyle from a tutorial."],[14,"Sleep on your hair in a silk scarf or loose braid."]]},{"range":"Days 15–21","title":"The details","tasks":[[15,"Give yourself a manicure: file, buff, cuticle oil."],[16,"Shape or groom your brows."],[17,"Exfoliate and moisturize your whole body."],[18,"Take care of your lips: scrub and balm."],[19,"Floss and use mouthwash. Make it a nightly habit."],[20,"Do a foot soak and moisturize your feet."],[21,"Take an \"everything shower\": hair, face, body, the works."]]},{"range":"Days 22–31","title":"Your signature look","tasks":[[22,"Make a Pinterest board of looks you love."],[23,"Create a 5-minute everyday makeup look (or a no-makeup \"clean girl\" look)."],[24,"Try a new makeup look for fun."],[25,"Find your \"signature scent\" (test perfumes, body sprays or oils)."],[26,"Clean all your makeup brushes and sponges."],[27,"Do a full glam and take photos."],[28,"Get your posture in check: shoulders back, chin up, all day."],[29,"Plan a weekly \"reset day\" routine (hair, nails, mask)."],[30,"Take another makeup-free selfie and compare to Day 1."],[31,"Write down your final morning and night routines and stick them on your mirror."]]}],"reflections":["What changes am I noticing in my skin?","Which part of my routine feels the most like self-care?","When did I feel most confident in how I looked this week?","What's my realistic daily routine going forward?"],"affirm":"Caring for myself isn't vanity. It's respect."},{"key":"jun","name":"June","theme":"Confidence","intro":"Confidence isn't something you're born with. It's a muscle, and it grows every time you do something that scares you a little. This month, you'll stretch your comfort zone one small step at a time.","weeks":[{"range":"Days 1–7","title":"Know yourself","tasks":[[1,"Write down 5 situations that make you nervous, from easiest to hardest."],[2,"List your top 5 strengths. Ask a friend to add 2 more."],[3,"Write down your core values (e.g. kindness, freedom, honesty)."],[4,"Stand in a \"power pose\" for 2 minutes before something stressful."],[5,"Write down a compliment someone once gave you that you still remember."],[6,"Record a voice memo of yourself talking about something you love."],[7,"Write your \"hype list\": achievements big and small you're proud of."]]},{"range":"Days 8–14","title":"Small brave steps","tasks":[[8,"Make eye contact and smile at 5 people."],[9,"Order for yourself or make that phone call you've been avoiding."],[10,"Give a genuine compliment to a stranger."],[11,"Speak up once in class, at work or in a group conversation."],[12,"Post something online without overthinking it."],[13,"Wear something bolder than usual."],[14,"Ask a question you'd normally be too shy to ask."]]},{"range":"Days 15–21","title":"Own your space","tasks":[[15,"Walk with your head up and shoulders back all day."],[16,"Stop saying \"sorry\" when you don't need to. Say \"thank you\" instead (\"thanks for waiting\")."],[17,"Share your opinion even if it's different from everyone else's."],[18,"Eat at a restaurant or cafe alone."],[19,"Start a conversation with someone new."],[20,"Take a full-body photo you feel good in."],[21,"Go somewhere new by yourself."]]},{"range":"Days 22–30","title":"Level up","tasks":[[22,"Do the easiest thing on your Day 1 list."],[23,"Accept a compliment with just \"thank you\" (no brushing it off)."],[24,"Try something you're bad at, and laugh about it."],[25,"Ask for something you want (a raise, a favor, a table by the window)."],[26,"Set a small goal and finish it today."],[27,"Do the next thing on your Day 1 list."],[28,"Sign up for something new: a class, club, team or event."],[29,"Write down the moment this month you felt most brave."],[30,"Re-read your Day 1 list. Cross off everything that doesn't scare you anymore."]]}],"reflections":["What did I learn about myself this week?","What brave thing did I do, and how did it feel after?","What thoughts held me back, and were they true?","How do I carry myself differently now?"],"affirm":"I get braver every time I show up."},{"key":"jul","name":"July","theme":"Adventure & Fun","intro":"A glow up needs joy, not just discipline. This month is about saying yes to new experiences, making memories and remembering how to play.","weeks":[{"range":"Days 1–7","title":"Get curious","tasks":[[1,"Write a summer bucket list with at least 20 things."],[2,"Watch the sunrise or sunset."],[3,"Try a food you've never eaten before."],[4,"Explore a part of your town you've never been to."],[5,"Have a picnic (a backyard or balcony counts)."],[6,"Go stargazing or watch the night sky for 15 minutes."],[7,"Do one thing from your bucket list."]]},{"range":"Days 8–14","title":"Get creative","tasks":[[8,"Paint, draw or doodle for 30 minutes, even if you \"can't.\""],[9,"Take 20 artsy photos on a walk."],[10,"Bake something from scratch."],[11,"Write a short poem or story."],[12,"Make a scrapbook page or collage of this summer so far."],[13,"Rearrange a corner of your room into a cozy spot."],[14,"Do one thing from your bucket list."]]},{"range":"Days 15–21","title":"Get social","tasks":[[15,"Plan a hangout with friends that isn't just scrolling together."],[16,"Have a game night (board games, cards, video games)."],[17,"Go to a local event: market, concert, festival or fair."],[18,"Spend quality time with a family member."],[19,"Invite someone new to hang out."],[20,"Have a movie marathon with homemade snacks."],[21,"Do one thing from your bucket list."]]},{"range":"Days 22–31","title":"Get outside","tasks":[[22,"Go swimming, to the beach, a lake or a pool."],[23,"Take a day trip somewhere within a couple of hours."],[24,"Go on a nature walk and collect a flower, leaf or rock."],[25,"Read a book outside for an hour."],[26,"Try an outdoor activity you've never done (paddleboarding, rock climbing, mini golf)."],[27,"Have a phone-free day (or afternoon)."],[28,"Do one thing from your bucket list."],[29,"Make a video or photo montage of your month."],[30,"Write down your 3 favorite memories from this month."],[31,"Plan one big adventure for later this year."]]}],"reflections":["What made me laugh the hardest this week?","What new thing did I try, and would I do it again?","Who do I feel most myself around?","How can I add more fun to my regular weeks?"],"affirm":"I say yes to joy."},{"key":"aug","name":"August","theme":"Get Organized","intro":"The \"that girl\" energy you've been chasing? A lot of it is just being organized. This month you'll build simple systems so life feels calmer and you stop forgetting things.","weeks":[{"range":"Days 1–7","title":"Plan your time","tasks":[[1,"Pick one planner system: paper planner, notes app or calendar app."],[2,"Add every upcoming birthday, appointment and deadline to it."],[3,"Do a Sunday-style weekly plan: goals, to-dos and events for the week."],[4,"Try time-blocking tomorrow: give every hour a job."],[5,"Write your \"big 3\" for today and do them before anything else."],[6,"Find your most productive hours and protect them."],[7,"Review your week. What worked? What slipped?"]]},{"range":"Days 8–14","title":"Beat procrastination","tasks":[[8,"Try the 2-minute rule: if it takes less than 2 minutes, do it now."],[9,"Use the Pomodoro method: 25 minutes focused, 5 minutes break."],[10,"Tackle the one task you've been avoiding longest."],[11,"Put your phone in another room while you work."],[12,"Batch similar tasks together (all emails, all errands)."],[13,"Set up a dedicated study or work spot."],[14,"Reward yourself for a productive week."]]},{"range":"Days 15–21","title":"Home systems","tasks":[[15,"Create a 10-minute nightly reset: dishes, clothes away, surfaces clear."],[16,"Give everything a \"home\": keys, charger, bag, sunglasses."],[17,"Plan your meals for the week and make a grocery list."],[18,"Meal prep 2–3 meals or snacks."],[19,"Make a weekly cleaning schedule (one zone per day)."],[20,"Lay out tomorrow's outfit tonight."],[21,"Set up a \"launch pad\" by the door for everything you need each morning."]]},{"range":"Days 22–31","title":"Life admin","tasks":[[22,"Organize your digital files into clear folders."],[23,"Back up your phone photos."],[24,"Update your passwords and turn on two-factor login for key accounts."],[25,"Write down all your subscriptions and what they cost."],[26,"Clear your email inbox (or archive everything older than a month)."],[27,"Book any appointments you've been putting off (dentist, doctor, haircut)."],[28,"Update your resume or write down recent accomplishments."],[29,"Make a \"someday\" list for ideas so they stop cluttering your head."],[30,"Plan next month's big goals and key dates."],[31,"Write down the 3 systems that helped you most this month."]]}],"reflections":["Where did my time actually go this week?","What task did I finally get done, and how did it feel?","Which system is saving me the most stress?","What do I want to automate or simplify next?"],"affirm":"Small systems create a calm life."},{"key":"sep","name":"September","theme":"Mindset & Learning","intro":"The biggest glow up happens between your ears. This month is about feeding your mind, learning something new and building a growth mindset.","weeks":[{"range":"Days 1–7","title":"Feed your mind","tasks":[[1,"Pick a book to read this month and read the first chapter."],[2,"Swap 30 minutes of scrolling for reading."],[3,"Listen to a podcast episode on a topic you know nothing about."],[4,"Watch a documentary or TED talk."],[5,"Write down your favorite quote from what you've read or heard this week."],[6,"Follow 5 accounts that teach you something."],[7,"Explain something you learned this week to a friend."]]},{"range":"Days 8–14","title":"Learn a skill","tasks":[[8,"Pick one skill to learn this month (a language, instrument, coding, cooking, editing)."],[9,"Find a free resource (app, YouTube playlist, library book)."],[10,"Practice your skill for 20 minutes."],[11,"Practice again. Consistency beats talent."],[12,"Set a small goal for your skill by the end of the month."],[13,"Practice for 20 minutes."],[14,"Record your progress (a video, photo or note) to compare later."]]},{"range":"Days 15–21","title":"Growth mindset","tasks":[[15,"Start journaling: write one page about how you're feeling."],[16,"Replace \"I can't\" with \"I can't *yet*\" all day."],[17,"Write about a failure and what it taught you."],[18,"Write down one limiting belief and 3 reasons it isn't true."],[19,"Visualize your life 5 years from now for 10 minutes. Write what you saw."],[20,"Make a vision board (Pinterest or paper)."],[21,"Practice your skill for 20 minutes."]]},{"range":"Days 22–30","title":"Think bigger","tasks":[[22,"Write down your dream life in detail: where you live, what you do, who's around you."],[23,"Pick one step toward that dream you can take this year."],[24,"Research someone who inspires you and how they got there."],[25,"Practice your skill for 20 minutes."],[26,"Finish your book (or keep going if it's long)."],[27,"Write a short review of your book: what stuck with you?"],[28,"Teach someone a bit of your new skill."],[29,"Record your skill progress again and compare to Day 14."],[30,"Pick next month's book."]]}],"reflections":["What's the most interesting thing I learned this week?","When did I catch myself thinking negatively, and how did I reframe it?","How is my new skill going, and what's challenging?","What does the future version of me need from me today?"],"affirm":"I am always growing."},{"key":"oct","name":"October","theme":"Mental Health & Cozy Self-Care","intro":"As the days get shorter, it's time to slow down and look after your inner world. This month is about calm, comfort and checking in with your feelings.","weeks":[{"range":"Days 1–7","title":"Check in","tasks":[[1,"Rate your mood from 1–10 each morning this month. Start today."],[2,"Write down 3 things that are stressing you out and one small action for each."],[3,"Try a 5-minute guided meditation."],[4,"Practice box breathing: in for 4, hold 4, out 4, hold 4. Repeat 5 times."],[5,"Name your feelings today. Try to go beyond \"fine\" or \"stressed.\""],[6,"Identify your warning signs of burnout and write them down."],[7,"Make a \"comfort list\": things that help when you're having a hard day."]]},{"range":"Days 8–14","title":"Get cozy","tasks":[[8,"Make your room extra cozy: blanket, candle or warm lighting."],[9,"Make a warm drink and enjoy it slowly with no phone."],[10,"Have a comfort movie night."],[11,"Take a long, warm bath or shower with calming music."],[12,"Bake something cozy (pumpkin bread, cookies, apple crumble)."],[13,"Go on an autumn walk and notice the colors."],[14,"Spend a slow morning with no plans."]]},{"range":"Days 15–21","title":"Protect your peace","tasks":[[15,"Take a full social media break for 24 hours."],[16,"Write down what \"peace\" looks like in your life."],[17,"Go to bed an hour earlier than usual."],[18,"Journal about something you've been bottling up."],[19,"Spend time with someone who makes you feel safe."],[20,"Cancel one plan you're dreading (it's okay)."],[21,"Try a hobby that relaxes you: puzzles, knitting, coloring or gardening."]]},{"range":"Days 22–31","title":"Build your toolkit","tasks":[[22,"Create a calming playlist."],[23,"Write yourself a \"bad day letter\" to read when you're struggling."],[24,"Try journaling with a prompt: \"What do I need right now?\""],[25,"Do something nice for someone else. Kindness boosts your mood too."],[26,"Spend 20 minutes in nature."],[27,"Write down 3 people you can reach out to when things are hard."],[28,"Do a full digital sunset: no screens after 9pm."],[29,"Look back at your mood ratings. Notice any patterns?"],[30,"Plan a cozy self-care night for yourself."],[31,"Celebrate Halloween or autumn in a way that feels fun to you."]]}],"reflections":["What's been on my mind most this week?","What helped me feel calm?","What do I need more of, and less of?","Which tools from my toolkit will I keep using?"],"affirm":"Rest is productive. My peace is a priority."},{"key":"nov","name":"November","theme":"Gratitude & Money","intro":"Two things that change everything: appreciating what you have, and taking control of your money. This month pairs daily gratitude with simple financial habits.","weeks":[{"range":"Days 1–7","title":"Gratitude every day","tasks":[[1,"Start a gratitude list: write 3 things you're thankful for. Do it every night this month."],[2,"Thank someone out loud for something specific they did."],[3,"Write a thank-you note to a teacher, coworker or mentor."],[4,"Notice 5 small things that went right today."],[5,"Take a photo of something beautiful you usually walk past."],[6,"Write about a hard time that led to something good."],[7,"Tell a friend why you're grateful for them."]]},{"range":"Days 8–14","title":"Know your money","tasks":[[8,"Write down all the money coming in each month (job, allowance, side hustle)."],[9,"Track every single thing you spend today, even small stuff."],[10,"Keep tracking. Look for patterns."],[11,"Sort your spending into needs, wants and savings."],[12,"Find your biggest \"money leak\" (takeout, online shopping, coffee)."],[13,"Try a no-spend day."],[14,"Write down your relationship with money: how do you feel about it?"]]},{"range":"Days 15–21","title":"Build habits","tasks":[[15,"Try a simple budget: 50% needs, 30% wants, 20% savings."],[16,"Set a savings goal (an emergency fund, a trip, something you want)."],[17,"Open a separate savings account or pot if you don't have one."],[18,"Set up an automatic transfer to savings, even if it's small."],[19,"Remove saved cards from shopping apps to slow down impulse buys."],[20,"Use the 48-hour rule: wait 2 days before buying anything non-essential."],[21,"Cook at home all day instead of ordering out."]]},{"range":"Days 22–30","title":"Grow & give","tasks":[[22,"Learn one money topic (compound interest, credit scores or investing basics)."],[23,"Brainstorm 3 ways you could earn extra money."],[24,"Sell something you no longer use."],[25,"Plan a holiday gift budget before the shopping rush."],[26,"Make a list of free fun things to do this winter."],[27,"Give back: donate, volunteer, or help someone in need."],[28,"Spend Thanksgiving (or a regular day) focused on who and what you're thankful for."],[29,"Check your savings goal progress."],[30,"Read back through your gratitude list from this month."]]}],"reflections":["What am I most grateful for this week?","What surprised me about my spending?","What's one money habit that's getting easier?","How has practicing gratitude changed my mood?"],"affirm":"I have enough, and I am enough."},{"key":"dec","name":"December","theme":"Reflect & Rest","intro":"You made it. This month is about slowing down, celebrating how far you've come, and dreaming up what's next. Rest is part of the glow up too.","weeks":[{"range":"Days 1–7","title":"Look back","tasks":[[1,"Flip back through this planner. Circle your favorite month."],[2,"Write down your top 10 moments of the year."],[3,"List every habit you've built this year."],[4,"Write about the hardest thing you went through this year and how you got through it."],[5,"Scroll your camera roll from January to now. Save your favorites to a \"my year\" album."],[6,"Re-read your January goals. Which did you reach? Which changed?"],[7,"Write down 5 lessons this year taught you."]]},{"range":"Days 8–14","title":"Slow down","tasks":[[8,"Sleep in without an alarm (if you can)."],[9,"Have a pajama day with a movie or book."],[10,"Go on a walk to see holiday lights or winter scenery."],[11,"Make a warm, cozy meal from scratch."],[12,"Spend an evening completely offline."],[13,"Take a long bath or pamper night."],[14,"Do absolutely nothing for an hour, guilt-free."]]},{"range":"Days 15–21","title":"Give & connect","tasks":[[15,"Make or write a handmade gift or card for someone."],[16,"Reach out to someone who made a difference in your year."],[17,"Donate clothes, toys or food to people who need them."],[18,"Spend quality time with family or friends."],[19,"Write a thank-you message to yourself for everything you did this year."],[20,"Do something kind for a stranger."],[21,"Celebrate the longest night of the year with candles and a cozy ritual."]]},{"range":"Days 22–31","title":"Dream big","tasks":[[22,"Write down who you want to be next year: how you'll feel, act and live."],[23,"Enjoy the holidays. Be present."],[24,"Enjoy the holidays. Put your phone away for the day."],[25,"Write down 3 things that made today special."],[26,"Pick your word of the year for next year."],[27,"Write 3 goals for next year: body, mind and life."],[28,"Make next year's vision board."],[29,"Take an \"after\" photo in the same spot as your January \"before.\""],[30,"Write a letter to yourself to open next December."],[31,"Celebrate. You showed up for yourself all year. That's the real glow up."]]}],"reflections":["What am I most proud of this year?","How did rest make me feel this week?","Who do I want to thank, and have I told them?","What am I most excited about for next year?"],"affirm":"I am proud of how far I've come."}],"prompts":{"jan":["What does a fresh start mean to me today?","One thing I'm ready to let go of:","How did my routine feel today?","What would make tomorrow 1% better?","Something I did today that future me will thank st tall, knees tracking over toes. Push through your whole foot to stand.","u":"https://youtube.com/results?search_query=Squat+exercise+how+to"},{"g":"Lower body","n":"Goblet squat","c":"A squat holding one dumbbell or kettlebell at your chest. The weight helps you stay upright. Elbows point down.","u":"https://youtube.com/results?search_query=Goblet+squat+exercise+how+to"},{"g":"Lower body","n":"Sumo squat","c":"Wide stance, toes turned out. Lower straight down, keeping knees pushed out. Great for inner thighs and glutes.","u":"https://youtube.com/results?search_query=Sumo+squat+exercise+how+to"},{"g":"Lower body","n":"Reverse lunge","c":"Step one foot back and lower until both knees are about 90°. Front heel stays down. Push through the front foot to return.","u":"https://youtube.com/results?search_query=Reverse+lunge+exercise+how+to"},{"g":"Lower body","n":"Walking lunges","c":"Lunge forward, then bring the back foot through into the next lunge. Keep your torso tall and steps controlled.","u":"https://youtube.com/results?search_query=Walking+lunges+exercise+how+to"},{"g":"Lower body","n":"Bulgarian split squat","c":"Back foot resting on a bench or couch, front foot a big step ahead. Lower straight down. Lean slightly forward for more glutes.","u":"https://youtube.com/results?search_query=Bulgarian+split+squat+exercise+how+to"},{"g":"Lower body","n":"Step-ups","c":"Step onto a sturdy bench or stair with your whole foot. Drive through that heel to stand tall, then lower slowly.","u":"https://youtube.com/results?search_query=Step-ups+exercise+how+to"},{"g":"Lower body","n":"Romanian deadlift","c":"Soft knees, push your hips straight back while sliding the weights down your thighs. Stop when you feel a hamstring stretch, then squeeze glutes to stand. Back stays flat.","u":"https://youtube.com/results?search_query=Romanian+deadlift+exercise+how+to"},{"g":"Lower body","n":"Deadlift","c":"Weights by your shins, hips back, chest proud, back flat. Push the floor away and stand tall. Lower with control.","u":"https://youtube.com/results?search_query=Deadlift+exercise+how+to"},{"g":"Lower body","n":"Hip thrust","c":"Upper back on a bench, feet flat. Drive hips up until your body is a straight line from knees to shoulders. Chin tucked, squeeze glutes at the top.","u":"https://youtube.com/results?search_query=Hip+thrust+exercise+how+to"},{"g":"Lower body","n":"Glute bridge","c":"Lying on your back, knees bent. Press through your heels to lift your hips and squeeze your glutes. Lower slowly.","u":"https://youtube.com/results?search_query=Glute+bridge+exercise+how+to"},{"g":"Lower body","n":"Single-leg glute bridge","c":"A glute bridge with one leg extended or lifted. Keep hips level as you press up.","u":"https://youtube.com/results?search_query=Single-leg+glute+bridge+exercise+how+to"},{"g":"Lower body","n":"Frog pumps","c":"Lying on your back, soles of the feet together and knees out. Pulse hips up quickly, squeezing glutes each rep.","u":"https://youtube.com/results?search_query=Frog+pumps+exercise+how+to"},{"g":"Lower body","n":"Leg press","c":"Feet hip-width on the platform. Lower until knees reach about 90° without your lower back lifting off the seat. Press through heels.","u":"https://youtube.com/results?search_query=Leg+press+exercise+how+to"},{"g":"Lower body","n":"Hamstring curl","c":"On a machine, curl your heels toward your glutes and lower slowly. At home, use sliders or a towel on a smooth floor from a bridge position.","u":"https://youtube.com/results?search_query=Hamstring+curl+exercise+how+to"},{"g":"Lower body","n":"Wall sit","c":"Back flat against a wall, slide down until knees are about 90°. Hold, breathing steadily.","u":"https://youtube.com/results?search_query=Wall+sit+exercise+how+to"},{"g":"Lower body","n":"Calf raises","c":"Rise onto the balls of your feet, pause, lower slowly. Hold a wall for balance if needed.","u":"https://youtube.com/results?search_query=Calf+raises+exercise+how+to"},{"g":"Lower body","n":"Squat jumps","c":"Squat down, then jump up explosively and land softly back into a squat. Swap for fast bodyweight squats to keep it low-impact.","u":"https://youtube.com/results?search_query=Squat+jumps+exercise+how+to"},{"g":"Lower body","n":"Skaters","c":"Leap side to side, landing softly on one leg with the other sweeping behind. Step instead of jump for low impact.","u":"https://youtube.com/results?search_query=Skaters+exercise+how+to"},{"g":"Glute isolation","n":"Cable kickback","c":"Ankle strap on a low cable. Hinge slightly forward and kick your leg straight back, squeezing the glute. No swinging.","u":"https://youtube.com/results?search_query=Cable+kickback+exercise+how+to"},{"g":"Glute isolation","n":"Donkey kicks","c":"On hands and knees, keep the knee bent and press one foot up toward the ceiling. Don't arch your lower back.","u":"https://youtube.com/results?search_query=Donkey+kicks+exercise+how+to"},{"g":"Glute isolation","n":"Fire hydrants","c":"On hands and knees, lift one bent knee out to the side, keeping hips level.","u":"https://youtube.com/results?search_query=Fire+hydrants+exercise+how+to"},{"g":"Glute isolation","n":"Clamshells","c":"Lying on your side, knees bent and feet together. Open the top knee like a clamshell without rolling your hips back. Add a band for more burn.","u":"https://youtube.com/results?search_query=Clamshells+exercise+how+to"},{"g":"Glute isolation","n":"Banded abduction","c":"Band above the knees. Seated, or in a half-squat, press your knees out against the band.","u":"https://youtube.com/results?search_query=Banded+abduction+exercise+how+to"},{"g":"Glute isolation","n":"Side-lying leg lifts","c":"Lying on your side, lift the top leg straight up with toes pointing forward, then lower slowly.","u":"https://youtube.com/results?search_query=Side-lying+leg+lifts+exercise+how+to"},{"g":"Glute isolation","n":"Bridge march","c":"Hold a glute bridge and slowly lift one foot at a time without letting your hips drop.","u":"https://youtube.com/results?search_query=Bridge+march+exercise+how+to"},{"g":"Upper body","n":"Push-ups","c":"Hands under shoulders, body in a straight line. Lower your chest toward the floor, elbows at about 45°. Do them against a counter or on knees to make it easier.","u":"https://youtube.com/results?search_query=Push-ups+exercise+how+to"},{"g":"Upper body","n":"Incline push-ups","c":"Hands on a counter, bench or wall. The higher the hands, the easier it is.","u":"https://youtube.com/results?search_query=Incline+push-ups+exercise+how+to"},{"g":"Upper body","n":"Dumbbell bench press","c":"Lying on a bench, press dumbbells up over your chest and lower slowly until elbows are just below the bench.","u":"https://youtube.com/results?search_query=Dumbbell+bench+press+exercise+how+to"},{"g":"Upper body","n":"Dumbbell row","c":"One hand and knee on a bench, flat back. Pull the dumbbell toward your hip, squeezing your shoulder blade back.","u":"https://youtube.com/results?search_query=Dumbbell+row+exercise+how+to"},{"g":"Upper body","n":"Seated row","c":"At a cable or with a band around your feet, pull the handles toward your belly button, chest tall, shoulders down.","u":"https://youtube.com/results?search_query=Seated+row+exercise+how+to"},{"g":"Upper body","n":"Lat pulldown","c":"Grip slightly wider than shoulders. Pull the bar to your upper chest, leading with your elbows. At home, anchor a band above a door.","u":"https://youtube.com/results?search_query=Lat+pulldown+exercise+how+to"},{"g":"Upper body","n":"Shoulder press","c":"Dumbbells at shoulder height, press straight up overhead without arching your lower back.","u":"https://youtube.com/results?search_query=Shoulder+press+exercise+how+to"},{"g":"Upper body","n":"Arnold press","c":"Start with palms facing you at shoulder height, rotate palms forward as you press up.","u":"https://youtube.com/results?search_query=Arnold+press+exercise+how+to"},{"g":"Upper body","n":"Lateral raise","c":"Light dumbbells at your sides, raise arms out to shoulder height with a slight bend in the elbows. Slow on the way down.","u":"https://youtube.com/results?search_query=Lateral+raise+exercise+how+to"},{"g":"Upper body","n":"Face pull","c":"Rope on a cable at face height. Pull toward your eyes, elbows high, squeezing between your shoulder blades. At home, use band pull-aparts.","u":"https://youtube.com/results?search_query=Face+pull+exercise+how+to"},{"g":"Upper body","n":"Band pull-aparts","c":"Hold a band at chest height with straight arms, pull it apart until it touches your chest.","u":"https://youtube.com/results?search_query=Band+pull-aparts+exercise+how+to"},{"g":"Upper body","n":"Biceps curl","c":"Elbows pinned by your sides, curl the weights up and lower slowly.","u":"https://youtube.com/results?search_query=Biceps+curl+exercise+how+to"},{"g":"Upper body","n":"Triceps extension","c":"Hold one dumbbell overhead with both hands, lower it behind your head, then extend. Keep elbows pointing forward.","u":"https://youtube.com/results?search_query=Triceps+extension+exercise+how+to"},{"g":"Upper body","n":"Farmer carry","c":"Hold heavy weights (or full grocery bags) at your sides and walk tall with shoulders back.","u":"https://youtube.com/results?search_query=Farmer+carry+exercise+how+to"},{"g":"Core & mobility","n":"Plank","c":"Forearms under shoulders, body in a straight line, glutes and abs tight. Drop to your knees to make it easier.","u":"https://youtube.com/results?search_query=Plank+exercise+how+to"},{"g":"Core & mobility","n":"Side plank","c":"On one forearm, stack your feet (or bend your knees) and lift your hips into a straight line.","u":"https://youtube.com/results?search_query=Side+plank+exercise+how+to"},{"g":"Core & mobility","n":"Dead bug","c":"On your back, arms up and knees at 90°. Slowly lower opposite arm and leg while keeping your lower back pressed down.","u":"https://youtube.com/results?search_query=Dead+bug+exercise+how+to"},{"g":"Core & mobility","n":"Bird dog","c":"On hands and knees, extend opposite arm and leg, keeping your hips level. Pause, then switch.","u":"https://youtube.com/results?search_query=Bird+dog+exercise+how+to"},{"g":"Core & mobility","n":"Bicycle crunches","c":"On your back, bring opposite elbow toward opposite knee while extending the other leg. Slow and controlled.","u":"https://youtube.com/results?search_query=Bicycle+crunches+exercise+how+to"},{"g":"Core & mobility","n":"Mountain climbers","c":"In a high plank, drive knees toward your chest one at a time. Go slow for control, fast for cardio.","u":"https://youtube.com/results?search_query=Mountain+climbers+exercise+how+to"},{"g":"Core & mobility","n":"Pallof press","c":"Stand side-on to a band or cable at chest height. Press it straight out and resist the twist. Hold, then return.","u":"https://youtube.com/results?search_query=Pallof+press+exercise+how+to"},{"g":"Core & mobility","n":"Pilates hundred (modified)","c":"On your back, knees bent at 90°, head and shoulders lifted. Pump your arms by your sides, breathing in for 5 counts and out for 5, up to 100.","u":"https://youtube.com/results?search_query=Pilates+hundred+%28modified%29+exercise+how+to"},{"g":"Core & mobility","n":"Single-leg stretch","c":"Head and shoulders lifted, hug one knee in while extending the other leg long. Switch smoothly.","u":"https://youtube.com/results?search_query=Single-leg+stretch+exercise+how+to"},{"g":"Core & mobility","n":"Cat-cow","c":"On hands and knees, round your back up toward the ceiling, then let your belly drop and lift your chest. Move with your breath.","u":"https://youtube.com/results?search_query=Cat-cow+exercise+how+to"},{"g":"Core & mobility","n":"World's greatest stretch","c":"From a lunge, place both hands inside your front foot, then rotate the inside arm up to the ceiling.","u":"https://youtube.com/results?search_query=World%27s+greatest+stretch+exercise+how+to"},{"g":"Core & mobility","n":"Child's pose","c":"Kneel, sit your hips back toward your heels and stretch your arms forward, forehead down. Breathe into your back.","u":"https://youtube.com/results?search_query=Child%27s+pose+exercise+how+to"},{"g":"Core & mobility","n":"Downward dog","c":"From hands and knees, lift your hips up and back into an upside-down V. Bend your knees as much as you need.","u":"https://youtube.com/results?search_query=Downward+dog+exercise+how+to"},{"g":"Core & mobility","n":"Low lunge","c":"Back knee down, front knee over the ankle. Gently shift your hips forward to stretch the front of the back hip.","u":"https://youtube.com/results?search_query=Low+lunge+exercise+how+to"},{"g":"Core & mobility","n":"Figure-4 stretch","c":"Lying on your back, cross one ankle over the opposite knee and gently pull the legs toward you.","u":"https://youtube.com/results?search_query=Figure-4+stretch+exercise+how+to"}],"mods":[{"n":"Squat","e":"Sit down to a chair and stand back up","h":"Hold a heavier weight, or pause 2 sec at the bottom"},{"n":"Push-ups","e":"Hands on a wall or kitchen counter","h":"Feet on a step, or lower for 3 slow seconds"},{"n":"Reverse lunge","e":"Hold a chair or wall for balance","h":"Hold dumbbells, or stand on a small step"},{"n":"Bulgarian split squat","e":"Split squat with both feet on the floor","h":"Add dumbbells, pause at the bottom"},{"n":"Hip thrust","e":"Glute bridge on the floor","h":"Single-leg, or a 3-sec squeeze at the top"},{"n":"Romanian deadlift","e":"Bodyweight hinge, tapping your hips to a wall","h":"Single-leg RDL, or heavier weights"},{"n":"Step-ups","e":"Use a low step","h":"Higher step, holding dumbbells"},{"n":"Plank","e":"Drop to your knees","h":"Add shoulder taps or lift one foot"},{"n":"Side plank","e":"Bottom knee down","h":"Lift your top leg"},{"n":"Dead bug","e":"Just tap your heels to the floor","h":"Straight legs, or hold a light weight"},{"n":"Dumbbell row","e":"Lighter weight, or a band","h":"Heavier weight, 2-sec squeeze at the top"},{"n":"Lat pulldown","e":"Lighter weight or band","h":"Work toward a   const sleepNow = +q.sleep||7; const wake = q.wake||"07:00"; const [wh,wm]=wake.split(":").map(Number); const wakeMin=wh*60+wm;
  const skin = q.skin||"normal";
  const focus = q.focus||[];
  const extraHabits = {stress:"5-minute calm reset", organized:"10-minute night reset", money:"Track today's spending", skin:"Skincare AM + PM, no skipping", confidence:"One brave thing today", phone:"No phone for the first 30 minutes"};
  const level = health.length && (q.level||"intermediate")==="advanced" ? "intermediate" : (q.level||"intermediate");

function waterTarget(){ const P=S.plan; if(!P) return 8; const n=daysSince(P.made); return Math.min(P.waterGoal, Math.max(P.waterNow+1, 1) + Math.floor(Math.max(0,n)/3)); }
function bedtime(){ const P=S.plan; if(!P) return null; const n=Math.max(0,daysSince(P.made)); const hrs=Math.min(P.sleepGoal, P.sleepNow + 0.25*Math.floor(n/3));
  return {time: fmtTime(P.wakeMin - Math.round(hrs*60)), hrs}; }
function planLabel(w, i){
  const P=S.plan, p=prog();
  if (!P){ let l=p.cal[i]; if (l==="A|B") l=(w%2===0)?"Workout A":"Workout B"; return l; }
  const set = TRAIN_DAYS[P.days]||TRAIN_DAYS[3]; const idx=w*7+i; let k=0;
  for (let j=0;j<idx;j++) if (set.includes(addDays(S.start,j).getDay())) k++;
  const wd = addDays(S.start,idx).getDay();
  if (set.includes(wd)) return p.workouts[k % p.workouts.length].name;
  if (wd===0) return "Rest";
  return p.key==="lean"||p.key==="flow" ? "Walk 30 min" : "Walk or rest";
}

async function shrink(file){
  let bmp; try { bmp = await createImageBitmap(file); } catch (e) {
    bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, k = Math.min(1, 1280 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
  return { blob, url: c.toDataURL("image/jpeg", 0.6) };
}

{"not_food": false, "name": "short meal name, max 6 words", "items": [{"name": "food", "portion": "e.g. 1 cup", "kcal": 0, "protein_g": 0}], "total_kcal": 0, "total_protein_g": 0, "note": "one short sentence on what was hard to judge, or empty"}`;

    const items = Array.isArray(r.items) ? r.items.map(i => ({ name: String(i.name||""), portion: String(i.portion||""), kcal: +i.kcal||0 })) : [];
